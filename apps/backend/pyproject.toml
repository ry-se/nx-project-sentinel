[project]
name = "sentinel-backend"
version = "0.1.0"
description = "Project Sentinel backend — detection API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136",
  "uvicorn[standard]>=0.46",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.2",
  "structlog>=24.0",
  "slowapi>=0.1",
  "httpx2>=0.1",
  "pillow>=11.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "regression: end-to-end regression guard (never deleted; .claude/rules/testing.md)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
