services:
  backend:
    build:
      context: .
      dockerfile: ./docker/backend.DockerFile
    container_name: sentinel-backend
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - sentinel-network
    restart: unless-stopped
    
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.DockerFile
    container_name: sentinel-frontend
    expose:
      - "4200"
    depends_on:
      - backend
    networks:
      - sentinel-network
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: sentinel-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - sentinel-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  sentinel-network:
    driver: bridge