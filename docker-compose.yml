services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.DockerFile
    container_name: sentinel-backend
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - database
    networks:
      - sentinel-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.DockerFile
    container_name: sentinel-frontend
    expose:
      - "4200"
    depends_on:
      - backend
    networks:
      - sentinel-network
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: sentinel-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - sentinel-network
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    container_name: sentinel-db
    environment:
      - POSTGRES_USER=sentinel
      - POSTGRES_PASSWORD=sentinel
      - POSTGRES_DB=sentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentinel-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  sentinel-network:
    driver: bridge